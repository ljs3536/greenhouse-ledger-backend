services:
  mariadb:
    image: mariadb:11.4
    container_name: greenhouse-ledger-db
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: greenhouse
      MARIADB_USER: farm
      MARIADB_PASSWORD: farm
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - greenhouse_ledger_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  greenhouse_ledger_data:
